<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8f3229" />
    <link rel="icon" type="image/png" href="images/playbar_thumbnail.png" />
    <title>Durga Pujo — Ultimate Paara Playlist</title>
    <style>
        :root {
            --cream: #fff8ed;
            --cream-soft: rgba(255, 248, 237, .72);
            --cream-faint: rgba(255, 248, 237, .46);
            --line: rgba(255, 248, 237, .14);
            --red: #a62f29;
            --red-deep: #6f261f;
            --brown: #6f4937;
            --dark: #100b09;
            --shadow: 0 28px 90px rgba(0, 0, 0, .44);
            --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            overflow: hidden;
            color: var(--cream);
            font-family: var(--font);
            background: #160c09;
        }

        button,
        input {
            font: inherit
        }

        button {
            color: inherit
        }

        .scene {
            min-height: 100svh;
            position: relative;
            isolation: isolate;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(12, 8, 6, .02) 0%, rgba(12, 8, 6, .04) 45%, rgba(12, 8, 6, .48) 100%),
                url("images/desktop_bg_morning.png") center/cover no-repeat;
        }

        .scene[data-theme="night"] {
            background:
                linear-gradient(180deg, rgba(12, 8, 6, .02) 0%, rgba(12, 8, 6, .04) 45%, rgba(12, 8, 6, .48) 100%),
                url("images/desktop_bg_night.png") center/cover no-repeat;
        }

        .scene::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 50% 35%, transparent 15%, rgba(11, 7, 5, .06) 55%, rgba(11, 7, 5, .26) 100%),
                linear-gradient(180deg, rgba(0, 0, 0, .08), transparent 30%);
            pointer-events: none;
        }


        @media (max-width: 500px) {
            .scene {
                background:
                    linear-gradient(180deg, rgba(12, 8, 6, .02) 0%, rgba(12, 8, 6, .04) 45%, rgba(12, 8, 6, .48) 100%),
                    url("images/mobile_bg_morning.png") center/cover no-repeat;
            }

            .scene[data-theme="night"] {
                background:
                    linear-gradient(180deg, rgba(12, 8, 6, .02) 0%, rgba(12, 8, 6, .04) 45%, rgba(12, 8, 6, .48) 100%),
                    url("images/mobile_bg_night.png") center/cover no-repeat;
            }

            .speaker-visual {
                left: 2px;
                bottom: 118px;
                width: 210px;
                height: 130px;
            }

            .speaker-wave {
                width: 72px;
                height: 72px;
            }

            .speaker-wave:nth-child(2) { left: 42px; bottom: 28px; }
            .speaker-wave:nth-child(3) { left: 88px; bottom: 8px; }
            .speaker-wave:nth-child(4) { left: 134px; bottom: 28px; }
        }

        .topline {
            position: fixed;
            z-index: 8;
            inset: 20px 24px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            pointer-events: none;
        }

        .brand-block {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .2em;
            text-transform: uppercase;
            text-shadow: 0 2px 18px rgba(0, 0, 0, .65);
        }

        .brand-time {
            margin-left: 2px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .14em;
            color: rgba(255, 248, 237, .88);
            text-shadow: 0 2px 18px rgba(0, 0, 0, .65);
            font-variant-numeric: tabular-nums;
        }

        .brand-count {
            margin-left: 18px;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: rgba(255, 248, 237, .82);
            text-shadow: 0 2px 18px rgba(0, 0, 0, .65);
            white-space: nowrap;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffe4b3;
            box-shadow: 0 0 0 6px rgba(255, 228, 179, .12);
        }

        .mini-note {
            pointer-events: auto;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: rgba(255, 248, 237, .65);
            text-shadow: 0 2px 18px rgba(0, 0, 0, .7);
        }

        .hero-mark {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            max-width: min(680px, 92vw);
            text-shadow: 0 10px 40px rgba(0, 0, 0, .55);
            user-select: none;
            pointer-events: none;
            text-align: left;
            z-index: 4;
        }

        .hero-mark .kicker {
            margin: 0 0 18px;
            font-size: clamp(11px, 1vw, 14px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .14em;
            color: rgba(255, 248, 237, .86);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hero-mark h1 {
            margin: 0;
            font-size: clamp(48px, 7vw, 96px);
            line-height: 1.02;
            letter-spacing: -.03em;
            font-weight: 820;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
            text-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        /* Single-line hero now; hero-main/sub styles retained for compatibility but hidden */
        .hero-mark .hero-main {
            display: block;
        }

        .hero-mark .hero-sub {
            display: block;
            margin-top: 6px;
        }

        .hero-mark .hero-heading-mobile {
            display: none;
        }

        .hero-mark h1 span {
            color: #fff;
        }

        @media (max-width:720px) {
            .hero-mark .hero-heading-desktop {
                display: none;
            }

            .hero-mark .hero-heading-mobile {
                display: block;
            }
        }

        .hero-mark .hero-accent {
            color: #fafafa;
        }

        .scrim {
            position: fixed;
            inset: 0;
            z-index: 9;
            background: rgba(7, 5, 4, .42);
            opacity: 0;
            pointer-events: none;
            transition: opacity .28s ease;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        body.playlist-open .scrim {
            opacity: 1;
            pointer-events: auto
        }

        /* FULL PLAYLIST */
        .playlist-panel {
            position: fixed;
            z-index: 12;
            left: 50%;
            bottom: 158px;
            width: min(940px, calc(100vw - 40px));
            max-height: min(64vh, 620px);
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            overflow: hidden;
            border: 1px solid rgba(255, 248, 237, .15);
            border-radius: 28px;
            background:
                radial-gradient(circle at 82% -20%, rgba(209, 71, 54, .24), transparent 35%),
                linear-gradient(180deg, rgba(31, 20, 16, .93), rgba(16, 11, 9, .96));
            box-shadow: 0 34px 110px rgba(0, 0, 0, .52);
            backdrop-filter: blur(28px) saturate(1.2);
            -webkit-backdrop-filter: blur(28px) saturate(1.2);
            transform: translate(-50%, 28px) scale(.985);
            transform-origin: bottom center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .26s ease, transform .32s cubic-bezier(.2, .8, .2, 1), visibility .26s;
        }

        body.playlist-open .playlist-panel {
            transform: translate(-50%, 0) scale(1);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .panel-top {
            padding: 18px 20px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .panel-title-wrap {
            min-width: 0
        }

        .panel-title {
            margin: 0;
            font-size: 18px;
            line-height: 1.05;
            letter-spacing: -.025em;
            font-weight: 820;
        }

        .panel-count {
            display: block;
            margin-top: 5px;
            font-size: 10px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--cream-faint);
        }

        .panel-actions {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .pill-btn,
        .icon-btn {
            border: 1px solid rgba(255, 248, 237, .13);
            background: rgba(255, 255, 255, .055);
            cursor: pointer;
            transition: .18s ease;
        }

        .pill-btn:hover,
        .icon-btn:hover {
            background: rgba(255, 255, 255, .11);
            transform: translateY(-1px)
        }

        .pill-btn:active,
        .icon-btn:active {
            transform: translateY(0) scale(.98)
        }

        .pill-btn {
            height: 38px;
            border-radius: 999px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .pill-btn svg {
            width: 15px;
            height: 15px
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
        }

        .icon-btn svg {
            width: 17px;
            height: 17px
        }

        .search-wrap {
            margin: 0 20px 12px;
            position: relative;
        }

        .search-wrap svg {
            position: absolute;
            left: 15px;
            top: 50%;
            width: 17px;
            height: 17px;
            transform: translateY(-50%);
            opacity: .55;
            pointer-events: none;
        }

        .search {
            width: 100%;
            height: 44px;
            border: 1px solid rgba(255, 248, 237, .12);
            border-radius: 14px;
            outline: 0;
            background: rgba(255, 255, 255, .045);
            color: var(--cream);
            padding: 0 14px 0 43px;
            transition: .18s ease;
        }

        .search::placeholder {
            color: rgba(255, 248, 237, .38)
        }

        .search:focus {
            border-color: rgba(255, 225, 176, .34);
            background: rgba(255, 255, 255, .07);
            box-shadow: 0 0 0 4px rgba(255, 225, 176, .04);
        }

        .list-shell {
            min-height: 0;
            overflow: hidden;
            border-top: 1px solid rgba(255, 248, 237, .07);
        }

        .list-head {
            display: grid;
            grid-template-columns: 36px minmax(0, 1.3fr) minmax(140px, .8fr) 62px;
            gap: 14px;
            align-items: center;
            padding: 11px 20px;
            color: rgba(255, 248, 237, .34);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .15em;
            text-transform: uppercase;
            background: rgba(0, 0, 0, .08);
        }

        .track-list {
            max-height: calc(min(64vh, 620px) - 149px);
            overflow: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 248, 237, .18) transparent;
        }

        .track-list::-webkit-scrollbar {
            width: 7px
        }

        .track-list::-webkit-scrollbar-thumb {
            background: rgba(255, 248, 237, .16);
            border-radius: 999px
        }

        .row {
            width: 100%;
            display: grid;
            grid-template-columns: 36px minmax(0, 1.3fr) minmax(140px, .8fr) 62px;
            gap: 14px;
            align-items: center;
            padding: 13px 20px;
            border: 0;
            border-bottom: 1px solid rgba(255, 248, 237, .055);
            background: transparent;
            text-align: left;
            cursor: pointer;
            transition: .15s ease;
        }

        .row:hover {
            background: rgba(255, 255, 255, .047)
        }

        .row.active {
            background: linear-gradient(90deg, rgba(184, 55, 44, .22), rgba(255, 255, 255, .025))
        }

        .row.active .row-title {
            color: #ffe4b3
        }

        .row.missing .index {
            opacity: .42
        }

        .index {
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            color: rgba(255, 248, 237, .34);
            text-align: center;
        }

        .row.active .index {
            color: #ffe4b3
        }

        .row-title,
        .row-singer,
        .row-year {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .row-title {
            font-size: 13px;
            font-weight: 720;
            letter-spacing: -.01em
        }

        .row-singer,
        .row-year {
            font-size: 11px;
            color: var(--cream-soft)
        }

        .row-year {
            font-variant-numeric: tabular-nums;
            text-align: right
        }

        .empty {
            padding: 48px 20px;
            text-align: center;
            color: var(--cream-faint);
            font-size: 12px
        }

        /* COMPACT PLAYER */
        .player-dock {
            position: fixed;
            z-index: 15;
            left: 50%;
            bottom: 22px;
            width: min(780px, calc(100vw - 36px));
            transform: translateX(-50%);
        }

        .player {
            position: relative;
            min-height: 112px;
            display: grid;
            grid-template-columns: 78px minmax(0, 1fr) auto;
            align-items: center;
            gap: 18px;
            padding: 14px 18px 14px 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 999px;
            background:
                radial-gradient(circle at 20% -45%, rgba(255, 225, 180, .16), transparent 44%),
                linear-gradient(102deg, rgba(91, 59, 44, .36) 0%, rgba(126, 62, 43, .34) 52%, rgba(160, 49, 45, .34) 100%);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .15);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            transition: box-shadow .25s ease, border-color .25s ease, transform .25s ease;
        }

        .player::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(120deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, .04) 25%, transparent 65%);
            opacity: .55;
            mix-blend-mode: screen;
        }

        .player.playing {
            border-color: rgba(255, 228, 179, .7);
        }

        .cover {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            overflow: hidden;
            flex: 0 0 auto;
            border: 2px solid rgba(255, 247, 235, .42);
            box-shadow: 0 8px 26px rgba(0, 0, 0, .35), 0 0 0 5px rgba(255, 255, 255, .035);
            background: #2a1711;
            position: relative;
            z-index: 1;
        }

        .cover::after {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, .35);
            opacity: 0;
            transition: opacity 0.24s ease;
        }

        .cover::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .95);
            box-shadow: 0 0 12px rgba(255, 255, 255, .35);
            transform: translate(-50%, -50%) rotate(0deg) translateY(-44px);
            transform-origin: center center;
            opacity: 0;
            transition: opacity 0.24s ease;
        }

        /* Pause overlay: visible when not playing (opacity 0.6) */
        .cover .cover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            opacity: 1;
            transition: opacity 0.24s ease;
            z-index: 2;
            pointer-events: none;
        }

        .player.playing .cover::after {
            opacity: 1;
        }

        .player.playing .cover::before {
            opacity: 1;
            animation: orbit-dot 1.7s linear infinite;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scale(1.07) rotate(0deg);
            transition: transform 0.32s linear;
        }

        /* Hide the pause overlay while playing and rotate the cover image */
        .player.playing .cover .cover-overlay {
            opacity: 0;
        }

        .player.playing .cover img {
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            from { transform: scale(1.07) rotate(0deg); }
            to { transform: scale(1.07) rotate(360deg); }
        }

        @keyframes orbit-dot {
            0% {
                transform: translate(-50%, -50%) rotate(0deg) translateY(-44px);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg) translateY(-44px);
            }
        }

        .player-center {
            min-width: 0;
            position: relative;
            z-index: 1;
            display: grid;
            gap: 10px;
        }

        .meta-line {
            min-width: 0
        }

        .now-title {
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
            font-weight: 790;
            letter-spacing: -.014em;
        }

        .now-singer {
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 11px;
            color: rgba(255, 248, 237, .72);
        }

        .progress-stack {
            display: grid;
            gap: 6px
        }

        .progress {
            --pct: 0%;
            width: 100%;
            height: 4px;
            appearance: none;
            border-radius: 999px;
            outline: 0;
            cursor: pointer;
            background: linear-gradient(90deg, #fff8ed var(--pct), rgba(255, 248, 237, .26) var(--pct));
        }

        .progress::-webkit-slider-thumb {
            appearance: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: 0;
            background: #fff8ed;
            opacity: 0;
            transition: .15s ease;
        }

        .progress:hover::-webkit-slider-thumb {
            opacity: 1
        }

        .progress::-moz-range-thumb {
            width: 9px;
            height: 9px;
            border: 0;
            border-radius: 50%;
            background: #fff8ed
        }

        .time-line {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 9px;
            font-variant-numeric: tabular-nums;
            color: rgba(255, 248, 237, .58);
        }

        .player-actions {
            display: flex;
            align-items: center;
            gap: 7px;
            position: relative;
            z-index: 1;
        }

        .control {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: transparent;
            color: rgba(255, 248, 237, .86);
            cursor: pointer;
            transition: .18s ease;
        }

        .control:hover {
            background: rgba(255, 255, 255, .09);
            transform: translateY(-1px)
        }

        .control:active {
            transform: translateY(0) scale(.96)
        }

        .control.active {
            color: #ffe4b3;
            background: rgba(255, 228, 179, .10)
        }

        .control svg {
            width: 17px;
            height: 17px
        }

        .play-main {
            width: 54px;
            height: 54px;
            border: 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #fff;
            color: #15100e;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(0, 0, 0, .25);
            transition: .18s ease;
        }

        .play-main:hover {
            transform: scale(1.045)
        }

        .play-main:active {
            transform: scale(.97)
        }

        .play-main svg {
            width: 22px;
            height: 22px
        }

        .full-view {
            height: 36px;
            border: 1px solid rgba(255, 248, 237, .17);
            border-radius: 999px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, .055);
            cursor: pointer;
            font-size: 9px;
            font-weight: 850;
            letter-spacing: .12em;
            text-transform: uppercase;
            transition: .18s ease;
        }

        .full-view:hover {
            background: rgba(255, 255, 255, .10)
        }

        .full-view svg {
            width: 15px;
            height: 15px
        }

        body.playlist-open .full-view {
            background: rgba(255, 228, 179, .12);
            border-color: rgba(255, 228, 179, .25);
            color: #ffe4b3
        }

        .toast {
            position: fixed;
            z-index: 30;
            left: 50%;
            bottom: 148px;
            max-width: min(88vw, 560px);
            transform: translate(-50%, 12px);
            opacity: 0;
            pointer-events: none;
            padding: 10px 14px;
            border: 1px solid rgba(255, 248, 237, .13);
            border-radius: 999px;
            background: rgba(16, 11, 9, .9);
            box-shadow: 0 16px 40px rgba(0, 0, 0, .34);
            color: var(--cream);
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: .2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        body.playlist-open .toast {
            bottom: calc(min(64vh, 620px) + 174px)
        }

        @media (max-width:720px) {
            .topline {
                inset: 18px 18px auto
            }

            .mini-note {
                display: none
            }

            .hero-mark {
                left: 20px;
                bottom: 168px;
                max-width: 88vw
            }

            .hero-mark h1 {
                font-size: clamp(38px, 12vw, 68px)
            }

            .player-dock {
                bottom: 12px;
                width: calc(100vw - 20px)
            }

            .player {
                min-height: 104px;
                grid-template-columns: 62px minmax(0, 1fr) auto;
                gap: 12px;
                padding: 12px 12px 12px 12px;
                border-radius: 26px;
            }

            .cover {
                width: 62px;
                height: 62px
            }

            .player-center {
                gap: 8px
            }

            .now-title {
                font-size: 13px
            }

            .now-singer {
                font-size: 10px
            }

            .player-actions {
                gap: 2px
            }

            .control {
                width: 32px;
                height: 32px
            }

            .play-main {
                width: 46px;
                height: 46px
            }

            .full-view {
                width: 34px;
                height: 34px;
                padding: 0;
                display: grid;
                place-items: center
            }

            .full-view span {
                display: none
            }

            #prevBtn {
                display: none
            }

            .playlist-panel {
                bottom: 126px;
                width: calc(100vw - 16px);
                max-height: calc(100svh - 152px);
                border-radius: 24px;
            }

            .track-list {
                max-height: calc(100svh - 292px)
            }

            .list-head,
            .row {
                grid-template-columns: 28px minmax(0, 1fr) 50px;
                gap: 10px;
                padding-left: 14px;
                padding-right: 14px;
            }

            .list-head .head-singer,
            .row-singer {
                display: none
            }

            .panel-top {
                padding: 16px 14px 12px
            }

            .search-wrap {
                margin: 0 14px 10px
            }

            .panel-actions .pill-btn span {
                display: none
            }

            .panel-actions .pill-btn {
                width: 38px;
                padding: 0;
                justify-content: center
            }

            .toast {
                bottom: 126px
            }

            body.playlist-open .toast {
                bottom: calc(100svh - 136px)
            }

            .scene::after {
                content: "";
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.3);
                pointer-events: none;
                z-index: 0;
            }
        }

        @media (max-width:430px) {
            .hero-mark {
                bottom: 152px
            }

            .player {
                grid-template-columns: 56px minmax(0, 1fr) auto;
                gap: 10px
            }

            .cover {
                width: 56px;
                height: 56px
            }

            #loopBtn {
                display: none
            }

            .play-main {
                width: 44px;
                height: 44px
            }
        }

        @media (max-width:720px) {
            .hero-mark {
                left: 50%;
                transform: translateX(-50%);
                top: 50%;
                bottom: auto;
                max-width: 92vw;
                text-align: center;
                pointer-events: none;
            }

            .hero-mark .kicker {
                display: block;
                text-align: center;
                font-size: clamp(12px, 4vw, 16px);
                white-space: nowrap;
            }

            /* keep both kicker and hero on one line each; scale down together if needed */
            .hero-mark h1 {
                font-size: clamp(18px, 6.5vw, 30px);
                line-height: 1.02;
                white-space: nowrap;
            }

            .hero-mark .hero-main {
                display: block;
            }

            .hero-mark .hero-sub {
                margin-top: 4px;
                font-size: clamp(14px, 3.6vw, 20px);
            }
        }

        @media (max-width:420px) {
            .hero-mark h1,
            .hero-mark .kicker {
                font-size: clamp(14px, 5.5vw, 18px);
                white-space: nowrap;
            }
        }

        @media (prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important
            }
        }

        /* Small-screen background dark overlay (black @ 0.3 opacity) */
        @media (max-width:720px) {
            .scene::after {
                content: "";
                position: absolute;
                inset: 0;
                background: rgba(0,0,0,0.3);
                pointer-events: none;
                z-index: 0;
            }
        }
    </style>
</head>

<body>
    <main class="scene">
        <header class="topline">
            <div class="brand-block">
                <div class="brand">
                    <span class="brand-dot"></span>
                    <span id="brandClock" class="brand-time">00:00:00</span>
                </div>
                <div id="brandCountdown" class="brand-count">0 days left</div>
            </div>
            <div class="mini-note">Durga Pujo · all night</div>
        </header>

        <div class="hero-mark" aria-hidden="true">
            <p class="kicker">Durga Pujo - All Night</p>
            <h1 class="hero-heading-desktop"><span class="hero-main">Ultimate</span><span class="hero-sub"><span class="hero-accent">Paara</span> Playlist</span></h1>
            <h1 class="hero-heading-mobile">Ultimate Paara Songs</h1>
        </div>
    </main>

    <div id="scrim" class="scrim" aria-hidden="true"></div>

    <section id="playlistPanel" class="playlist-panel" aria-label="Full playlist" aria-hidden="true">
        <div class="panel-top">
            <div class="panel-title-wrap">
                <h2 class="panel-title">Ultimate Paara Playlist</h2>
                <span id="trackCount" class="panel-count">23 songs</span>
            </div>
            <div class="panel-actions">
                <button id="playAllBtn" class="pill-btn" type="button" title="Play all available songs">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                    <span>Play all</span>
                </button>
                <button id="collapseBtn" class="icon-btn" type="button" aria-label="Collapse playlist" title="Collapse">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
                        <path d="m7 9 5 5 5-5" />
                    </svg>
                </button>
            </div>
        </div>

        <label class="search-wrap" aria-label="Search playlist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="11" cy="11" r="6.6" />
                <path d="m16 16 4 4" />
            </svg>
            <input id="search" class="search" type="search" autocomplete="off"
                placeholder="Search song, singer or year" />
        </label>

        <div class="list-shell">
            <div class="list-head" aria-hidden="true">
                <span>#</span><span>Song</span><span class="head-singer">Singer</span><span
                    style="text-align:right">Year</span>
            </div>
            <div id="trackList" class="track-list"></div>
        </div>
    </section>

    <div class="player-dock">
        <section class="player" aria-label="Music player">
            <div class="cover">
                <img src="images/playbar_thumbnail.png" alt="Durga Pujo playlist artwork" />
                <div class="cover-overlay" aria-hidden="true"></div>
            </div>

            <div class="player-center">
                <div class="meta-line">
                    <h2 id="currentTitle" class="now-title">Emon Madhur Sandhyay</h2>
                    <div id="currentSinger" class="now-singer">Asha Bhosle · 1987</div>
                </div>
                <div class="progress-stack">
                    <input id="progress" class="progress" type="range" min="0" max="1000" value="0"
                        aria-label="Song progress" />
                    <div class="time-line"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
                </div>
            </div>

            <div class="player-actions">
                <button id="loopBtn" class="control active" type="button" aria-label="Loop playlist" aria-pressed="true"
                    title="Loop playlist">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path d="M17 2l3 3-3 3" />
                        <path d="M4 11V9a4 4 0 0 1 4-4h12" />
                        <path d="m7 22-3-3 3-3" />
                        <path d="M20 13v2a4 4 0 0 1-4 4H4" />
                    </svg>
                </button>
                <button id="prevBtn" class="control" type="button" aria-label="Previous song" title="Previous">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M6.5 5h2v14h-2zM18 5 9.5 12 18 19z" />
                    </svg>
                </button>
                <button id="playBtn" class="play-main" type="button" aria-label="Play">
                    <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </button>
                <button id="nextBtn" class="control" type="button" aria-label="Next song" title="Next">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M15.5 5h2v14h-2zM6 5l8.5 7L6 19z" />
                    </svg>
                </button>
                <button id="fullViewBtn" class="full-view" type="button" aria-expanded="false"
                    aria-controls="playlistPanel" title="Open full playlist">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path d="M5 6h14M5 12h14M5 18h9" />
                    </svg>
                    <span id="fullViewText">Full view</span>
                </button>
            </div>
        </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <audio id="audio" preload="metadata"></audio>

    <script src="tracks.js"></script>

    <script>
        /* ================================================================
           ONLY EDIT THIS ARRAY WHEN YOU ADD SONGS.
           Put MP3 files inside /audio and paste the exact filename below.
           Songs with file: "" stay visible/searchable but are skipped by Play All.
           ================================================================ */
        // Playlist is now loaded from `tracks.js` (shared file). See tracks.js for editing.

        const audio = document.getElementById("audio");
        const list = document.getElementById("trackList");
        const search = document.getElementById("search");
        const playBtn = document.getElementById("playBtn");
        const playIcon = document.getElementById("playIcon");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const loopBtn = document.getElementById("loopBtn");
        const playAllBtn = document.getElementById("playAllBtn");
        const fullViewBtn = document.getElementById("fullViewBtn");
        const fullViewText = document.getElementById("fullViewText");
        const collapseBtn = document.getElementById("collapseBtn");
        const playlistPanel = document.getElementById("playlistPanel");
        const scrim = document.getElementById("scrim");
        const progress = document.getElementById("progress");
        const currentTimeEl = document.getElementById("currentTime");
        const durationEl = document.getElementById("duration");
        const currentTitle = document.getElementById("currentTitle");
        const currentSinger = document.getElementById("currentSinger");
        const trackCount = document.getElementById("trackCount");
        const toast = document.getElementById("toast");
        const player = document.querySelector(".player");
        const brandClock = document.getElementById("brandClock");
        const brandCountdown = document.getElementById("brandCountdown");
        const scene = document.querySelector(".scene");

        function getNextPujoStart() {
            const now = new Date();
            const next = new Date(now.getFullYear(), 9, 16, 0, 0, 0, 0);
            if (next <= now) {
                next.setFullYear(next.getFullYear() + 1);
            }
            return next;
        }

        function updateBrandClock() {
            if (!brandClock) return;
            const now = new Date();
            brandClock.textContent = now.toLocaleTimeString("en-GB", { hour12: false });
        }

        function updateBrandCountdown() {
            if (!brandCountdown) return;
            const now = new Date();
            const pujoStart = getNextPujoStart();
            const diffMs = pujoStart - now;
            const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
            const daysText = diffDays === 1 ? "day" : "days";
            brandCountdown.textContent = `${diffDays} ${daysText} left`;
        }

        function updateSceneTheme() {
            if (!scene) return;
            const now = new Date();
            const hour = now.getHours();
            const isNight = hour >= 20 || hour < 6;
            scene.setAttribute("data-theme", isNight ? "night" : "day");
        }

        // Load shared TRACKS if not already loaded (tracks.js must be included before this script)
        if (typeof TRACKS === 'undefined') {
            console.warn('TRACKS not found. Make sure tracks.js is loaded.');
            window.TRACKS = [];
        }

        let currentIndex = TRACKS.findIndex(track => track.file);
        if (currentIndex < 0) currentIndex = 0;
        let loopPlaylist = true;
        let toastTimer;

        function formatTime(seconds) {
            if (!Number.isFinite(seconds)) return "0:00";
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
            return `${minutes}:${secs}`;
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
        }

        function openPlaylist(force) {
            const shouldOpen = typeof force === "boolean" ? force : !document.body.classList.contains("playlist-open");
            document.body.classList.toggle("playlist-open", shouldOpen);
            playlistPanel.setAttribute("aria-hidden", String(!shouldOpen));
            fullViewBtn.setAttribute("aria-expanded", String(shouldOpen));
            fullViewBtn.title = shouldOpen ? "Collapse playlist" : "Open full playlist";
            fullViewText.textContent = shouldOpen ? "Collapse" : "Full view";
        }

        function setPlayIcon(playing) {
            playIcon.innerHTML = playing
                ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'
                : '<path d="M8 5v14l11-7z"/>';
            playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
        }

        function setNowPlaying(index) {
            const track = TRACKS[index];
            if (!track) return;
            currentTitle.textContent = track.title;
            currentSinger.textContent = `${track.singer} · ${track.year}`;
            renderTracks();
        }

        function visibleTrackIndexes() {
            const query = search.value.trim().toLowerCase();
            return TRACKS
                .map((track, index) => ({ track, index }))
                .filter(({ track }) => {
                    if (!query) return true;
                    return `${track.title} ${track.singer} ${track.year}`.toLowerCase().includes(query);
                })
                .map(({ index }) => index);
        }

        function renderTracks() {
            const indexes = visibleTrackIndexes();
            list.innerHTML = "";
            trackCount.textContent = `${indexes.length} ${indexes.length === 1 ? "song" : "songs"}`;

            if (!indexes.length) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = "No matching song";
                list.appendChild(empty);
                return;
            }

            indexes.forEach((trackIndex, visibleIndex) => {
                const track = TRACKS[trackIndex];
                const row = document.createElement("button");
                row.type = "button";
                row.className = `row${trackIndex === currentIndex ? " active" : ""}${track.file ? "" : " missing"}`;
                row.setAttribute("aria-label", `Play ${track.title} by ${track.singer}`);

                const index = document.createElement("span");
                index.className = "index";
                index.textContent = trackIndex === currentIndex && !audio.paused ? "●" : String(visibleIndex + 1).padStart(2, "0");

                const title = document.createElement("span");
                title.className = "row-title";
                title.textContent = track.title;

                const singer = document.createElement("span");
                singer.className = "row-singer";
                singer.textContent = track.singer;

                const year = document.createElement("span");
                year.className = "row-year";
                year.textContent = track.year;

                row.append(index, title, singer, year);
                row.addEventListener("click", () => playTrack(trackIndex));
                list.appendChild(row);
            });
        }

        async function playTrack(index) {
            const track = TRACKS[index];
            if (!track) return;
            if (!track.file) {
                showToast(`Audio not added yet — ${track.title}`);
                return;
            }

            const changed = index !== currentIndex || !audio.src;
            currentIndex = index;
            setNowPlaying(index);

            if (changed) {
                audio.src = track.file;
                progress.value = 0;
                progress.style.setProperty("--pct", "0%");
                currentTimeEl.textContent = "0:00";
                durationEl.textContent = "0:00";
            }

            try {
                await audio.play();
            } catch (error) {
                setPlayIcon(false);
                showToast(`Could not play ${track.title}`);
                console.error(error);
            }
        }

        async function togglePlay() {
            const track = TRACKS[currentIndex];
            if (!track || !track.file) {
                const firstPlayable = TRACKS.findIndex(item => item.file);
                if (firstPlayable === -1) {
                    showToast("No audio files added yet");
                    return;
                }
                await playTrack(firstPlayable);
                return;
            }

            if (!audio.src) {
                await playTrack(currentIndex);
                return;
            }

            if (audio.paused) {
                try { await audio.play(); }
                catch (error) { showToast(`Could not play ${track.title}`); }
            } else {
                audio.pause();
            }
        }

        function nextPlayableIndex(direction = 1) {
            const playable = TRACKS
                .map((track, index) => track.file ? index : -1)
                .filter(index => index !== -1);

            if (!playable.length) return -1;
            const position = playable.indexOf(currentIndex);
            if (position === -1) return direction > 0 ? playable[0] : playable[playable.length - 1];

            const nextPosition = position + direction;
            if (nextPosition >= playable.length) return loopPlaylist ? playable[0] : -1;
            if (nextPosition < 0) return loopPlaylist ? playable[playable.length - 1] : playable[0];
            return playable[nextPosition];
        }

        function playNext() {
            const next = nextPlayableIndex(1);
            if (next === -1) {
                audio.pause();
                audio.currentTime = 0;
                return;
            }
            playTrack(next);
        }

        playBtn.addEventListener("click", togglePlay);
        prevBtn.addEventListener("click", () => {
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }
            const previous = nextPlayableIndex(-1);
            if (previous !== -1) playTrack(previous);
        });
        nextBtn.addEventListener("click", () => {
            const next = nextPlayableIndex(1);
            if (next !== -1) playTrack(next);
        });

        loopBtn.addEventListener("click", () => {
            loopPlaylist = !loopPlaylist;
            loopBtn.classList.toggle("active", loopPlaylist);
            loopBtn.setAttribute("aria-pressed", String(loopPlaylist));
            showToast(loopPlaylist ? "Playlist loop on" : "Playlist loop off");
        });

        playAllBtn.addEventListener("click", () => {
            const firstVisiblePlayable = visibleTrackIndexes().find(index => TRACKS[index].file);
            if (firstVisiblePlayable === undefined) {
                showToast("No audio file added for these results");
                return;i 
            }
            playTrack(firstVisiblePlayable);
        });

        fullViewBtn.addEventListener("click", () => openPlaylist());
        collapseBtn.addEventListener("click", () => openPlaylist(false));
        scrim.addEventListener("click", () => openPlaylist(false));
        search.addEventListener("input", renderTracks);

        audio.addEventListener("play", () => { setPlayIcon(true); player?.classList.add("playing"); renderTracks(); });
        audio.addEventListener("pause", () => { setPlayIcon(false); player?.classList.remove("playing"); renderTracks(); });
        audio.addEventListener("ended", () => { player?.classList.remove("playing"); playNext(); });
        audio.addEventListener("loadedmetadata", () => {
            durationEl.textContent = formatTime(audio.duration);
        });
        audio.addEventListener("timeupdate", () => {
            const pct = audio.duration ? (audio.currentTime / audio.duration) * 1000 : 0;
            progress.value = pct;
            progress.style.setProperty("--pct", `${pct / 10}%`);
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });
        audio.addEventListener("error", () => {
            if (currentIndex >= 0) showToast(`Missing audio — ${TRACKS[currentIndex].file}`);
        });

        progress.addEventListener("input", () => {
            if (!audio.duration) return;
            audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
        });

        document.addEventListener("keydown", event => {
            const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName || "");
            if (event.key === "Escape" && document.body.classList.contains("playlist-open")) {
                openPlaylist(false);
            }
            if (event.code === "Space" && !typing) {
                event.preventDefault();
                togglePlay();
            }
            if (event.key === "/" && !typing) {
                event.preventDefault();
                openPlaylist(true);
                search.focus();
            }
        });

        updateBrandClock();
        updateBrandCountdown();
        updateSceneTheme();
        setInterval(updateBrandClock, 1000);
        setInterval(updateBrandCountdown, 60000);
        setInterval(updateSceneTheme, 60000);
        setNowPlaying(currentIndex);
        setPlayIcon(false);
        renderTracks();
    </script>
</body>

</html>
