<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Playlist Array</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #17110e;
            color: #fff7e9;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(1100px, 100%);
            margin: auto;
        }

        a {
            color: #d8b27b;
        }

        h1 {
            margin: 25px 0 6px;
            font-size: 42px;
        }

        p {
            color: rgba(255, 255, 255, .6);
        }

        .box {
            margin-top: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 16px;
            background: rgba(255, 255, 255, .035);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
            text-align: left;
            font-size: 12px;
        }

        th {
            color: rgba(255, 255, 255, .45);
            font-size: 9px;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        td:first-child {
            width: 45px;
            color: rgba(255, 255, 255, .4);
        }

        td:last-child {
            color: #d8b27b;
            font-family: monospace;
            font-size: 10px;
        }

        pre {
            margin: 0;
            padding: 18px;
            overflow: auto;
            color: rgba(255, 255, 255, .72);
            font-size: 11px;
            line-height: 1.6;
        }

        @media (max-width: 650px) {
            body {
                padding: 15px;
            }

            .box {
                overflow-x: auto;
            }

            table {
                min-width: 760px;
            }
        }
    </style>
</head>

<body>

    <main>
        <a href="index.html">← Back to player</a>

        <h1>Playlist Array</h1>
        <p>This page shows the same songs and exact audio paths used by the player.</p>

        <div class="box">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Song</th>
                        <th>Artist</th>
                        <th>Year</th>
                        <th>Audio filename</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="box">
            <pre id="arrayCode"></pre>
        </div>
    </main>

    <script src="tracks.js"></script>

    <script>
        const body = document.getElementById("tableBody");
        const code = document.getElementById("arrayCode");

        TRACKS.forEach((track, index) => {
            const row = document.createElement("tr");

            [
                String(index + 1),
                track.title,
                track.singer,
                track.year,
                track.file
            ].forEach((value) => {
                const cell = document.createElement("td");
                cell.textContent = value || "";
                row.appendChild(cell);
            });

            body.appendChild(row);
        });

        code.textContent =
            "const TRACKS = " +
            JSON.stringify(TRACKS, null, 4) +
            ";";
    </script>

</body>

</html>
