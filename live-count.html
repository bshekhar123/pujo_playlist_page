<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Count</title>
  <style>
    :root {
      --bg: #0b0908;
      --panel: rgba(16, 13, 12, 0.8);
      --gold: #f8d17a;
      --gold-soft: #ffd980;
      --text: #f4efe7;
      --muted: rgba(244, 239, 231, 0.72);
      --dot: #53d58a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(248, 209, 122, 0.12), transparent 32%),
        linear-gradient(180deg, #120d0b 0%, #090807 100%);
      overflow: hidden;
    }

    .card {
      width: min(92vw, 560px);
      padding: 28px 26px 22px;
      border: 1px solid rgba(248, 209, 122, 0.2);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--dot);
      box-shadow: 0 0 12px rgba(83, 213, 138, 0.9);
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.7; }
    }

    .count-wrap {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 12px;
    }

    .count {
      font-size: clamp(60px, 13vw, 132px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.06em;
      color: var(--gold-soft);
      text-shadow: 0 0 24px rgba(248, 209, 122, 0.3);
    }

    .suffix {
      font-size: clamp(16px, 3vw, 24px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .time {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="label">
      <span class="dot" aria-hidden="true"></span>
      <span>Live listeners</span>
    </div>

    <div class="count-wrap">
      <div id="liveCount" class="count">00</div>
      <div class="suffix">Now</div>
    </div>

    <div id="lastUpdated" class="time">Updated just now</div>
  </main>

  <script>
    (() => {
      const countEl = document.getElementById('liveCount');
      const lastUpdatedEl = document.getElementById('lastUpdated');

      function getMonthlyLiveCount() {
        const BASE_COUNT = 94;
        const BASE_YEAR = 2026;
        const BASE_MONTH = 7; // August (0-indexed)

        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();

        const monthsDiff = (currentYear - BASE_YEAR) * 12 + (currentMonth - BASE_MONTH);

        if (monthsDiff <= 0) {
          return BASE_COUNT;
        }

        const MONTHLY_INCREMENTS = [3, 4, 3, 5, 2, 4, 3, 5, 3, 4, 2, 5];
        let totalIncrement = 0;

        for (let i = 0; i < monthsDiff; i++) {
          totalIncrement += MONTHLY_INCREMENTS[i % MONTHLY_INCREMENTS.length];
        }

        return BASE_COUNT + totalIncrement;
      }

      function formatClock(date) {
        return date.toLocaleTimeString('en-GB', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
      }

      function refresh() {
        const now = new Date();
        const value = getMonthlyLiveCount();
        countEl.textContent = String(value);
        lastUpdatedEl.textContent = 'Updated ' + formatClock(now);
      }

      refresh();
      setInterval(refresh, 86400000);
    })();
  </script>
</body>
</html>
