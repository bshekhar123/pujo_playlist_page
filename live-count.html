<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Count</title>
  <style>
    :root {
      --bg: #0b0908;
      --panel: rgba(16, 13, 12, 0.8);
      --gold: #f8d17a;
      --gold-soft: #ffd980;
      --text: #f4efe7;
      --muted: rgba(244, 239, 231, 0.72);
      --dot: #53d58a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(248, 209, 122, 0.12), transparent 32%),
        linear-gradient(180deg, #120d0b 0%, #090807 100%);
      overflow: hidden;
    }

    .card {
      width: min(92vw, 560px);
      padding: 28px 26px 22px;
      border: 1px solid rgba(248, 209, 122, 0.2);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--dot);
      box-shadow: 0 0 12px rgba(83, 213, 138, 0.9);
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.7; }
    }

    .count-wrap {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 12px;
    }

    .count {
      font-size: clamp(60px, 13vw, 132px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.06em;
      color: var(--gold-soft);
      text-shadow: 0 0 24px rgba(248, 209, 122, 0.3);
    }

    .suffix {
      font-size: clamp(16px, 3vw, 24px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .time {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="label">
      <span class="dot" aria-hidden="true"></span>
      <span>Live listeners</span>
    </div>

    <div class="count-wrap">
      <div id="liveCount" class="count">00</div>
      <div class="suffix">Now</div>
    </div>

    <div id="lastUpdated" class="time">Updated just now</div>
  </main>

  <script>
    (() => {
      const countEl = document.getElementById('liveCount');
      const lastUpdatedEl = document.getElementById('lastUpdated');

      const LISTENER_SCHEDULE = [
        { start: 0, end: 120, min: 20, max: 80 },        // 12 AM - 2 AM
        { start: 120, end: 300, min: 1, max: 8 },         // 2 AM - 5 AM
        { start: 300, end: 420, min: 5, max: 22 },        // 5 AM - 7 AM
        { start: 420, end: 540, min: 20, max: 65 },       // 7 AM - 9 AM
        { start: 540, end: 720, min: 45, max: 110 },      // 9 AM - 12 PM
        { start: 720, end: 900, min: 70, max: 145 },      // 12 PM - 3 PM
        { start: 900, end: 1020, min: 90, max: 175 },     // 3 PM - 5 PM
        { start: 1020, end: 1140, min: 140, max: 215 },   // 5 PM - 7 PM
        { start: 1140, end: 1350, min: 185, max: 248 },   // 7 PM - 10:30 PM
        { start: 1350, end: 1440, min: 110, max: 190 }    // 10:30 PM - 12 AM
      ];

      function clamp(val, min, max) {
        return Math.min(Math.max(val, min), max);
      }

      function getPeriodForMinute(minuteOfDay) {
        for (const period of LISTENER_SCHEDULE) {
          if (minuteOfDay >= period.start && minuteOfDay < period.end) {
            return period;
          }
        }
        return LISTENER_SCHEDULE[0];
      }

      function getTargetCount(date) {
        const minutes = date.getHours() * 60 + date.getMinutes();
        const period = getPeriodForMinute(minutes);

        const progress = (minutes - period.start) / (period.end - period.start || 1);
        const wave = Math.sin((minutes + 17) / 12) * 0.25;
        const span = period.max - period.min;
        const baseTarget = period.min + (progress * span * 0.7) + (span * 0.15) + (wave * span * 0.3);

        return clamp(Math.round(baseTarget), period.min, period.max);
      }

      let lastSimulatedCount = null;

      function calculateSimulatedCount(date) {
        const target = getTargetCount(date);

        if (lastSimulatedCount === null) {
          lastSimulatedCount = target;
          return lastSimulatedCount;
        }

        const diff = target - lastSimulatedCount;
        let step = 0;

        if (Math.abs(diff) <= 2) {
          const direction = Math.random() > 0.45 ? 1 : -1;
          step = direction * Math.floor(2 + Math.random() * 3);
        } else {
          const maxStep = Math.min(Math.abs(diff), Math.floor(2 + Math.random() * 11));
          step = Math.sign(diff) * Math.max(2, maxStep);
        }

        const next = clamp(lastSimulatedCount + step, 1, 248);
        lastSimulatedCount = next;
        return next;
      }

      function formatClock(date) {
        return date.toLocaleTimeString('en-GB', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
      }

      function refresh() {
        const now = new Date();
        const value = calculateSimulatedCount(now);
        countEl.textContent = String(value);
        lastUpdatedEl.textContent = 'Updated ' + formatClock(now);
      }

      refresh();
      setInterval(refresh, 300000);
    })();
  </script>
</body>
</html>
